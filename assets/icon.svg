<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background rounded plate -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Radar glow rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5"/>

  <!-- Rocket Ship -->
  <g transform="translate(64,64) rotate(45) translate(-64,-64)">
    <!-- Exhaust flame -->
    <path d="M 58 84 Q 64 104 70 84 Q 64 92 58 84 Z" fill="url(#flameGrad)" />
    <!-- Fins -->
    <path d="M 46 68 L 54 62 L 54 78 Z" fill="#6366f1" />
    <path d="M 82 68 L 74 62 L 74 78 Z" fill="#6366f1" />
    <!-- Body -->
    <path d="M 64 24 C 54 40 52 64 54 80 L 74 80 C 76 64 74 40 64 24 Z" fill="url(#rocketGrad)" />
    <!-- Porthole Window -->
    <circle cx="64" cy="48" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="64" cy="48" r="3" fill="#38bdf8"/>
  </g>
</svg>
